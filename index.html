<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tool Store">
<title>Tool Store</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0f14;--surface:#161a22;--card:#1e2330;--border:#2a3040;--accent:#f0a500;--accent2:#3b82f6;--text:#e8ecf4;--muted:#6b7899;--warn:#ef4444;--green:#22c55e;--radius:14px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:'DM Mono',monospace;min-height:100dvh;overflow-x:hidden}
header{position:sticky;top:0;z-index:100;background:rgba(13,15,20,.94);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--border);padding:14px 20px 12px;display:flex;align-items:center;justify-content:space-between}
.logo{font-family:'Syne',sans-serif;font-size:20px;font-weight:800;letter-spacing:-.5px}
.logo span{color:var(--accent)}
.hdr-count{font-size:11px;color:var(--muted)}
.tabs{display:flex;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:57px;z-index:99}
.tab{flex:1;padding:8px 2px;text-align:center;font-size:9px;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);cursor:pointer;border:none;background:none;border-bottom:2px solid transparent;transition:all .2s;line-height:1.4}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.page{display:none;padding:16px 16px 120px}
.page.active{display:block}
</style>
</head>
<body>
<header>
  <div class="logo">Tool <span>Store</span></div>
  <div class="hdr-count">0 items</div>
</header>

<div class="tabs">
  <button class="tab active">Home</button>
  <button class="tab">Scan</button>
  <button class="tab">Inventory</button>
</div>

<div class="page active">
  <div class="home-btns">
    <div class="home-btn active-mode">
      <span class="home-btn-icon">📷</span>
      <div class="home-btn-name">Scan</div>
      <div class="home-btn-sub">Add new item</div>
    </div>
    <div class="home-btn">
      <span class="home-btn-icon">📦</span>
      <div class="home-btn-name">Inventory</div>
      <div class="home-btn-sub">View stock</div>
    </div>
  </div>
</div>
</body>
</html>
